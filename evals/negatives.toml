# Questions the documentation cannot answer. Every one must come back caveated.
#
# `absent` names the words that must appear nowhere in the corpus for the label to
# hold; `tools/gate_check.py --audit` checks them and excludes any case whose token
# turns out to be in the documentation after all. See README.md.
#
# Grouped by WHY it is unanswerable, because the classes fail through different
# mechanisms and reporting one number over all of them hides which mechanism broke.

# --- another site's machine -------------------------------------------------
#
# The most plausible wrong question this app will ever be asked. A UChicago
# researcher with an allocation at TACC, NCSA or ALCF asks in fluent HPC dialect
# about a cluster the RCC does not run, and every word except the machine's name
# matches the User Guide richly.

[[negative]]
text = "how do I submit a job on Frontera"
absent = ["frontera"]
why = "TACC's machine, not RCC's"
kind = "other-site"

# The same machine, pasted rather than named — and the shape that got through. Inside a
# URL every "names a thing" signal is blind: the labels are lower case, so capitalisation
# says nothing, and no preposition introduces them. It scored 27.4 and the gate stayed
# confident. `Mention.in_address` is the signal; a pasted address is how a reader asks
# about a page rather than a topic, so this is not an exotic query.
[[negative]]
text = "how do I use https://frontera.tacc.utexas.edu"
absent = ["frontera", "tacc"]
why = "TACC's machine, named only inside a URL"
kind = "other-site"

