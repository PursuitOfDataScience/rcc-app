# --- a resource that does not exist ----------------------------------------
#
# RCC-shaped names for things the RCC does not have. These are version-numbered
# tokens, which the unseen-word rule skips by design (`bm25.py`, the digit branch)
# because a job ID is not a topic — so nothing at all flags them.

# `gpu2` was here as a partition that does not exist. It does — six Midway2 nodes with
# K80s, in the table in slurm/partitions.md, and `#SBATCH --partition=gpu2` is in
# sbatch.md. The audit caught the mislabel and the case is now an answerable question in
# questions.toml. Left as a comment because it is the best example in the set of why
# `absent` is checked: written from memory, this looked exactly like the other three.

[[negative]]
text = "how many GPUs per node does Midway4 have"
absent = ["midway4"]
why = "no such cluster"
kind = "nonexistent-resource"

