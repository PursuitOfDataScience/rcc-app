# --- every word known, the fact not recorded ----------------------------
#
# The quadrant nothing else in this file covers, and the one the score floor exists for.
# These questions use only words the documentation uses, so there is no absent token to
# audit and the label rests on judgement — which is why they are a separate table that
# says so rather than `[[negative]]` entries with an empty `absent`.
#
# They earn their place: with `MIN_CONFIDENT_SCORE` at 20 they score 12–18 and are
# caveated, and `tools/gate_check.py --sweep` shows that lowering the floor to 14 would
# remove the two remaining over-refusals at no cost in caveat recall. It would also let
# these through. Without them the sweep looked like a free win.

[[unrecorded]]
text = "how many people work at the computing center"
why = "no headcount in the documentation"

[[unrecorded]]
text = "when was the cluster built"
why = "no history in the documentation"

[[unrecorded]]
text = "how old are the compute nodes"
why = "hardware is listed, its age is not"

[[unrecorded]]
text = "is the documentation written by staff or by users"
why = "the documentation does not describe its own authorship"

[[unrecorded]]
text = "what time of day is the cluster busiest"
why = "no utilisation statistics in the documentation"

[[unrecorded]]
text = "how many users does the cluster have"
why = "no user count in the documentation"

[[unrecorded]]
text = "how much does the university spend on computing each year"
why = "no budget in the documentation"

# --- the trap on the other side -----------------------------------------
#
# NOT negatives. Answerable questions that each carry a word the documentation has
# never seen — a job number, a CNetID, a daemon named in an error message. Every one
# of these was refused by the first version of the weak-retrieval idea, which is what
# made it unusable, and they are here so that a fix aimed at the leaks above cannot
# quietly reintroduce that. Scored as over-refusals when they are caveated.

[[identifier]]
text = "my job was killed by slurmstepd oom-kill event"
why = "an OOM kill is documented; slurmstepd is just the daemon's name"

[[identifier]]
text = "why did job 41235567 fail"
why = "a job number is not a topic"

[[identifier]]
text = "my CNetID is jsmith and I cannot log in"
why = "logging in is documented; the CNetID is an identifier"

[[identifier]]
text = "srun: error: task 0 launch failed: Unspecified error"
why = "an srun failure is documented; the error string is not a topic"

[[identifier]]
text = "sbatch: error: Batch job submission failed: Invalid account or account/partition combination specified"
why = "account/partition mismatch is documented"

[[identifier]]
text = "I get Permission denied (publickey) connecting to midway3"
why = "SSH key setup is documented; the error text is not a topic"

[[identifier]]
text = "my transfer says Globus endpoint 4bd2c1a8 is not activated"
why = "endpoint activation is documented; the UUID is an identifier"

[[identifier]]
text = "quota exceeded writing to /project2/pi-jsmith"
why = "quotas are documented; the path names a person"

[[identifier]]
text = "SBATCH: ERROR: BATCH JOB SUBMISSION FAILED: INVALID ACCOUNT"
why = "pasted in caps, where capitalisation distinguishes nothing — and in caps every word looks like a proper noun"
