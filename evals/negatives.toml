# --- the wrong scheduler ---------------------------------------------------
#
# Users arrive with habits from PBS, LSF and HTCondor sites. The RCC runs Slurm, so
# the honest answer names Slurm's equivalent and says the rest is not documented —
# not a confident walkthrough of a command that does not exist here.

[[negative]]
text = "how do I submit a job with qsub"
absent = ["qsub"]
why = "PBS/Torque, not Slurm"
kind = "wrong-scheduler"

[[negative]]
