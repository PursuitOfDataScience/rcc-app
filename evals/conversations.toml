[[conversation]]
name = "interactive then time limit"
why = "an ellipsis follow-up about the thing just described"

[[conversation.turn]]
text = "how do I start an interactive session on a compute node"
pages = ["slurm/sinteractive.md"]
must_mention = ["sinteractive"]

[[conversation.turn]]
text = "how long can it run for?"
pages = ["slurm/sinteractive.md", "slurm/partitions.md"]
carries = "which kind of session has a time limit"

[[conversation]]
name = "quota then the other filesystem"
why = "a comparison follow-up: the reader is still asking about quotas"

[[conversation.turn]]
text = "what is my home directory quota"
pages = ["storage/main.md", "storage/faq.md"]

[[conversation.turn]]
text = "what about on scratch?"
pages = ["storage/main.md", "storage/faq.md"]
must_mention = ["scratch"]
carries = "that the question is still about quotas"

[[conversation]]
name = "python then a package"
why = "the follow-up is a step inside the first answer's workflow"

[[conversation.turn]]
text = "how do I set up a Python environment"
pages = ["software/apps-and-envs/python.md"]
must_mention = ["conda"]

[[conversation.turn]]
text = "how do I add a package to it?"
pages = ["software/apps-and-envs/python.md"]
must_mention = ["conda"]
carries = "which environment the package goes into"

[[conversation]]
name = "doubted after an answer"
why = "where the real leak arrived — not on a probe, but from a reader doubting the answer he had just been given. The same message is in meta.toml as a single turn; here it has an answer in front of it to be doubted, which is the shape that produced 'via the search_docs and read_doc tools'."

[[conversation.turn]]
text = "how do I submit a batch job"
pages = ["slurm/sbatch.md"]
must_mention = ["sbatch"]

[[conversation.turn]]
text = "not sure if all your answers have gone through your brain or you just bs"
expect = "self"
carries = "the answer being doubted, which is the turn before it"
