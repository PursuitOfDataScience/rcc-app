name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The retrieval layer is importable without Streamlit or the Mistral SDK,
      # which is what keeps this job fast. pypdf is installed so the upload tests
      # exercise real parsing rather than the ImportError fallback.
      - name: Install test dependencies
        run: pip install --disable-pip-version-check pytest ruff pypdf httpx

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Check app.js parses
        run: node --check static/app.js

      # Renders static/app.css against a replica of Streamlit's DOM in the Chrome
      # already present on the runner, and fails on clipping, content hidden behind
      # the input bar, horizontal overflow, unwanted wrapping, a control something
      # else is painted on top of, the gap between a question and its answer, dead
      # space above the input bar, or low contrast — see the docstring in
      # tools/render_check.py. Every UI bug that has shipped from this repo was
      # pure CSS, and this runner's Chrome has caught one this sandbox's did not.
      # Once per profile: each supplies its own welcome copy, starter-card labels
      # and brand palette, and all three are things that clip or fail contrast.
      # The site profile's first palette rendered inline code at 2.62:1 in dark
      # mode, and its first card labels wrapped from 966px down.
      - name: Check the layout renders correctly
        env:
          SAGE_CHROME: /usr/bin/google-chrome
        run: |
          if [ ! -x "$SAGE_CHROME" ]; then
            echo "::warning::No Chrome on the runner; skipping the layout check."
            exit 0
          fi
          for profile in rcc site; do
            echo "::group::layout ($profile)"
            SAGE_PROFILE="$profile" python tools/render_check.py
            echo "::endgroup::"
          done

  deps:
    name: Dependencies resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      # Guards the class of bug this replaced: requirements.txt listed a package
      # that was never imported while omitting one that was, and the SDK import
      # path differs between mistralai 0.x and 1.x.
      - name: Verify the imports the app actually uses
        run: |
          python - <<'PY'
          import httpx
          import streamlit
          import pymupdf
          from mistralai import Mistral
          from pypdf import PdfReader
          print("streamlit", streamlit.__version__)
          print("imports OK")
          PY

      # Both corpora, because a profile that cannot be indexed is a deployment
      # that boots to an empty assistant rather than to an error.
      - name: Build the documentation index
        run: |
          python - <<'PY'
          import logging
          logging.basicConfig(level=logging.INFO)
          from sage import corpus, profiles, search
          for key, probe in (("rcc", "storage quota"), ("site", "argonne pretraining")):
              profile = profiles.get(key)
              built = corpus.build(profile=profile)
              index = search.Index(built)
              assert built.chunks, f"{key}: no chunks indexed"
              assert index.search(probe), f"{key}: search returned nothing"
              print(f"{key}:", corpus.summarize(built))
          PY
